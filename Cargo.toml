[package]
name = "somnium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
gpui = "0.2.2"
gpui-component = "0.5.0"
rust-embed = "8.9.0"
sqlx = { version = "0.8.6", features = ["macros", "runtime-tokio", "sqlite", "tls-rustls"] }
symphonia = { version = "0.5.5", features = ["all"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
